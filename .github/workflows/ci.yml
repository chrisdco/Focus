name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test

      # Bundler smoke test: exercises Metro, babel, expo-router, NativeWind
      # CSS, fonts, and every asset require. This is what would have caught
      # the nativewind/babel preset misplacement and any missing route asset.
      - run: bunx expo export --platform web --output-dir dist-web
        env:
          CI: 1
